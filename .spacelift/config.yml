version: 2

# The version here is arbitrary and not being used anywhere.
# We just need to bump it if we want the tests to be running, as they don't run for
# versions that already exist.
module_version: "0.0.1"

tests:
  - name: Basic example
    project_root: examples/basic-example
    environment:
      TF_VAR_aws_region: "eu-west-2"
  - name: Without auto mode
    project_root: examples/without-auto-mode
    environment:
      TF_VAR_aws_region: "eu-west-2"
  - name: Without ECR
    project_root: examples/without-ecr
    environment:
      TF_VAR_aws_region: "eu-west-1"
    after_apply:
      # With create_container_registry = false the ECR outputs are null (a null output
      # is not stored at all) and no output carries an image setting. kubernetes_secrets
      # holds secrets: only grep it and print key names, never values.
      - |
        set -eu
        TF_BIN=$(command -v tofu || command -v terraform || true)
        [ -n "$TF_BIN" ] || for b in /bin/tofu /bin/terraform; do [ -x "$b" ] && TF_BIN=$b && break; done
        [ -n "$TF_BIN" ] && [ -x "$TF_BIN" ] || { echo "FAIL: no tofu or terraform binary"; exit 1; }
        echo "ER10-CHECK using $TF_BIN"
        ALL_OUTPUTS=$($TF_BIN output -json)
        echo "$ALL_OUTPUTS" | grep -q '"helm_values"' || { echo "FAIL: could not read the outputs"; exit 1; }
        for o in ecr_backend_repository_url ecr_launcher_repository_url; do
          if echo "$ALL_OUTPUTS" | grep -q "\"$o\""; then echo "FAIL: $o is set"; exit 1; fi
        done
        SHELL_OUT=$($TF_BIN output -raw shell)
        HELM_VALUES=$($TF_BIN output -raw helm_values)
        K8S_SECRETS=$($TF_BIN output -raw kubernetes_secrets)
        echo "kubernetes_secrets keys:"; echo "$K8S_SECRETS" | grep -oE '^ +[A-Z_]+:' | tr -d ' :' | sort | tr '\n' ' '; echo
        if echo "$SHELL_OUT" | grep -qE 'PRIVATE_ECR_LOGIN_URL|BACKEND_IMAGE|LAUNCHER_IMAGE'; then echo "FAIL: shell has image lines"; exit 1; fi
        if echo "$HELM_VALUES" | grep -qE '^ *image:'; then echo "FAIL: helm_values has an image"; exit 1; fi
        if echo "$K8S_SECRETS" | grep -qE 'LAUNCHER_IMAGE'; then echo "FAIL: kubernetes_secrets has LAUNCHER_IMAGE"; exit 1; fi
        echo "$SHELL_OUT" | grep -q 'BINARIES_BUCKET_NAME=.' || { echo "FAIL: shell misses BINARIES_BUCKET_NAME"; exit 1; }
        echo "$HELM_VALUES" | grep -q 'secretRef: "spacelift-shared"' || { echo "FAIL: helm_values misses shared.secretRef"; exit 1; }
        echo "$K8S_SECRETS" | grep -qE '^  DATABASE_URL: ".+"' || { echo "FAIL: kubernetes_secrets misses DATABASE_URL"; exit 1; }
        echo "ER10-CHECK OK: ecr_* outputs absent; checked shell ($(echo "$SHELL_OUT" | wc -l) lines), helm_values ($(echo "$HELM_VALUES" | wc -l) lines), kubernetes_secrets ($(echo "$K8S_SECRETS" | grep -cE '^ +[A-Z_]+:') keys): no image settings"
  - name: Upgrade from v4.3.1
    project_root: examples/upgrade-from-v4.3.1
    environment:
      TF_VAR_aws_region: "eu-west-3"
    after_apply:
      # The example is applied with the latest release. Plan the same config with
      # this branch against a copy of the state, in a temp dir with a local backend,
      # so the run's own state is never touched. Pass: no resource or output changes;
      # the moved block for module.ecr in the AWS base module is allowed (a plan
      # with only moves exits 2).
      - |
        set -eu
        TF_BIN=$(command -v tofu || command -v terraform || true)
        [ -n "$TF_BIN" ] || for b in /bin/tofu /bin/terraform; do [ -x "$b" ] && TF_BIN=$b && break; done
        [ -n "$TF_BIN" ] && [ -x "$TF_BIN" ] || { echo "FAIL: no tofu or terraform binary"; exit 1; }
        echo "ER10-CHECK using $TF_BIN"
        REPO_ROOT=$(cd ../.. && pwd)
        WORK=$(mktemp -d)
        cp main.tf provider.tf variables.tf "$WORK/"
        $TF_BIN state pull > "$WORK/terraform.tfstate"
        grep -q '"resources"' "$WORK/terraform.tfstate" || { echo "FAIL: could not pull the state"; exit 1; }
        sed -i "s#github.com/spacelift-io/terraform-aws-eks-spacelift-selfhosted?ref=v4.3.1#$REPO_ROOT#" "$WORK/main.tf"
        grep -q "source = \"$REPO_ROOT\"" "$WORK/main.tf" || { echo "FAIL: source was not switched"; exit 1; }
        cd "$WORK"
        $TF_BIN init -input=false -no-color > /dev/null
        set +e
        $TF_BIN plan -input=false -no-color -lock=false -detailed-exitcode > plan.txt 2>&1
        RC=$?
        set -e
        cat plan.txt
        echo "plan exit code: $RC"
        if [ "$RC" = 0 ]; then echo "ER10-CHECK OK: no changes"; exit 0; fi
        [ "$RC" = 2 ] || { echo "FAIL: plan errored"; exit 1; }
        grep -q 'Plan: 0 to add, 0 to change, 0 to destroy' plan.txt || { echo "FAIL: the upgrade changes resources"; exit 1; }
        if grep -q 'Changes to Outputs' plan.txt; then echo "FAIL: the upgrade changes outputs"; exit 1; fi
        if grep -E '^  # ' plan.txt | grep -qv 'has moved to'; then echo "FAIL: the plan has more than moves"; exit 1; fi
        echo "ER10-CHECK OK: only moves ($(grep -c 'has moved to' plan.txt)), no resource or output changes"
